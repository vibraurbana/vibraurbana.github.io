<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada — VIBRA URBANA</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="64x64" href="/assets/img/favicon-64.png">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#111;color:#f5f5f5;font-family:Inter,system-ui,sans-serif;text-align:center;padding:24px}
  h1{font-size:1.6rem;margin:0 0 8px} p{color:#b4b4b4;margin:0 0 20px}
  a{display:inline-block;background:#ffd200;color:#111;font-weight:700;text-decoration:none;padding:12px 20px;border-radius:8px;margin:4px}
</style>
<script>
// Producto nuevo cuyo enlace amigable aun no se publico (el sitio se actualiza cada pocas horas):
// /producto/<nombre>-<id>/  ->  /producto.html?id=<id> (conserva utm_source y demas).
(function () {
  var m = location.pathname.match(/\/producto\/[^\/]*-(\d+)\/?$/);
  if (m) location.replace("/producto.html?id=" + m[1] + (location.search ? "&" + location.search.slice(1) : ""));
})();
</script>
</head>
<body>
  <main>
    <h1>No encontramos esta página</h1>
    <p>Puede que el enlace esté desactualizado.</p>
    <a href="/catalogo.html">Ver catálogo</a><a href="/">Ir al inicio</a>
  </main>
</body>
</html>
