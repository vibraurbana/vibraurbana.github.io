<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo de zapatos — VIBRA URBANA</title>
<meta name="description" content="Explora el catálogo de zapatos VIBRA URBANA: filtra por estilo, color y talla, y consulta tu pedido por WhatsApp.">
<meta name="theme-color" content="#111111">
<link rel="icon" type="image/png" sizes="64x64" href="assets/img/favicon-64.png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="canonical" href="https://tiendavibraurbana.com/catalogo.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="VIBRA URBANA">
<meta property="og:locale" content="es_BO">
<meta property="og:title" content="Catálogo de zapatos — VIBRA URBANA">
<meta property="og:description" content="Explora el catálogo de zapatos VIBRA URBANA: filtra por estilo, color y talla, y consulta tu pedido por WhatsApp.">
<meta property="og:url" content="https://tiendavibraurbana.com/catalogo.html">
<meta property="og:image" content="https://tiendavibraurbana.com/assets/img/og-cover.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/catalogo.css">
</head>
<body>

<header class="site-header">
  <div class="container site-header__inner">

    <a href="index.html" class="brand">
      <picture class="brand__picture">
        <img src="assets/img/logo-t.webp" alt="VIBRA URBANA" class="brand__logo">
      </picture>
    </a>

    <nav class="site-header__nav" aria-label="Principal">
      <a href="index.html">Inicio</a>
      <a href="catalogo.html">Catálogo</a>
      <a href="como-comprar.html">Cómo comprar</a>
      <a href="visitanos.html">Visítanos</a>
      <a href="contacto.html">Contacto</a>
    </nav>

    <div class="site-header__search">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="search" placeholder="Buscar productos..." aria-label="Buscar productos" onfocus="document.querySelector('[data-catalogo-search]').focus()" readonly>
    </div>

    <div class="site-header__icons">
      <a class="site-header__icon-btn" href="carrito.html" aria-label="Ver carrito" title="Carrito">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1.4" fill="currentColor" stroke="none"/><circle cx="19" cy="21" r="1.4" fill="currentColor" stroke="none"/><path d="M2.5 3h2l2.6 12.6a2 2 0 0 0 2 1.6h8.4a2 2 0 0 0 2-1.6L21 8H6"/></svg>
        <span class="cart-badge" data-cart-count hidden>0</span>
      </a>
    </div>
  </div>
</header>

<main class="container">

  <div class="catalogo-head">
    <div class="catalogo-head__row">
      <h1 class="catalogo-head__title">Catálogo</h1>
      <time class="catalogo-head__date" data-catalogo-generado></time>
    </div>
    <p class="catalogo-head__subtitle">Encuentra tu próximo estilo.</p>
  </div>

  <div class="catalogo-search" id="buscador">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input type="search" placeholder="Buscar por nombre..." aria-label="Buscar en el catálogo" data-catalogo-search>
    <button type="button" class="catalogo-search__clear" data-catalogo-search-clear aria-label="Limpiar búsqueda">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>

  <div class="chip-row catalogo-chips" data-catalogo-chips role="group" aria-label="Filtrar por estilo">
    <!-- pintado por render-catalogo.js -->
  </div>

  <div class="catalogo-toolbar">
    <div class="catalogo-toolbar__filtros">
      <label class="chip catalogo-toolbar__orden">
        Ordenar
        <select data-catalogo-orden>
          <option value="destacados">Destacados</option>
          <option value="recientes">Más recientes</option>
          <option value="nombre_asc">Nombre A-Z</option>
          <option value="precio_asc">Precio: menor a mayor</option>
          <option value="precio_desc">Precio: mayor a menor</option>
        </select>
      </label>

      <button type="button" class="chip" data-catalogo-solo-stock aria-pressed="false">Disponibles</button>

      <details class="filtro-pop" id="popColor">
        <summary>Color</summary>
        <div class="filtro-pop__panel">
          <div class="filtro-pop__opciones" data-panel-color></div>
          <a href="#" class="filtro-pop__reset" data-reset-color>Quitar filtro</a>
        </div>
      </details>

      <details class="filtro-pop" id="popTalla">
        <summary>Talla</summary>
        <div class="filtro-pop__panel">
          <div class="filtro-pop__opciones" data-panel-talla></div>
          <a href="#" class="filtro-pop__reset" data-reset-talla>Quitar filtro</a>
        </div>
      </details>
    </div>

    <span class="catalogo-toolbar__count" data-catalogo-count></span>
  </div>

  <div class="product-grid" data-catalogo-grid></div>

  <nav class="catalogo-pagination" data-catalogo-pagination aria-label="Paginación del catálogo"></nav>

  <div class="catalogo-empty" data-catalogo-empty hidden>
    <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <strong>No encontramos productos con esos filtros</strong>
    <p>Prueba con otra palabra o quita algún filtro para ver más opciones.</p>
    <button type="button" class="btn btn--outline" data-catalogo-empty-reset>Quitar todos los filtros</button>
  </div>

</main>

<footer class="site-footer"></footer>

<script type="module" src="assets/js/render-catalogo.js"></script>
</body>
</html>
